<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos basicos JS</title>
    <Link rel="stylesheet" href="css/style.css"></Link>
</head>
<body>
    <section class="ejemplo">
        <h1>Ejemplo JavaScript</h1>
    </section>

    <section class="ejemplo">
        <h2 id="titulo">Esto es un titulo</h2>
        <p class="description">Esto es un parrafo</p>
    </section>

    <section class="ejemplo">
        <button id="btnSaludar" type="button">Saludar</button>
        <p id="mensajeSaludar"></p>
    </section>

    <section class="ejemplo">
        <div id="tarjeta">
            Pasa el mouse sobre este texto
        </div>
    </section>

    <section class="ejemplo">
        <label for="nombreImput">Nombre:</label>
        <input id="txtNombre" type="text">
        <button id="btnMostrar" type="button">
           Mostrar Texto 
        </button>
        <p id="TextoSalida"></p>
    </section>

    <section class="ejemplo">
        <h1 id="textoCambiar">TEXTO A CAMBIAR</h1>
        <button id="btnCambiar" type="button">
           presione para cambiar el h1 
        </button>
    </section>

    <section class="ejemplo">
        <input type="text" id="nuevaTarea" placeholder="Escriba una tarea">
        <button id="btnAgregar">
            Agregar
        </button>
        <ul id="listaTareas"></ul>
    </section>

    <script>
        console.log("La pagina se ejecuto")
        alert("HOLA MUNDO")
    </script>
    <script src="js/ejemplos.js"></script>
</body>
</html>
