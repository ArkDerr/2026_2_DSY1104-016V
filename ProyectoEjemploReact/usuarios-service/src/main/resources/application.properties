server.port=8082

# H2 persistente: ejecutar Maven desde la carpeta raiz de este microservicio.
# Si se inicia desde otro directorio, definir DB_DIR con una ruta absoluta.
spring.datasource.url=jdbc:h2:file:${DB_DIR:./data}/usuarios-service;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Los dos servicios deben compartir JWT_SECRET en sus respectivos procesos.
# Valor por defecto exclusivo de la demostracion local; nunca usar en produccion.
app.jwt.secret=${JWT_SECRET:ClaveDidacticaCompartidaEntreAmbosServiciosMinimo32Caracteres2026}
app.seed.enabled=${APP_SEED_ENABLED:true}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
