<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level-Up Gamer | Ingreso</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="login-page">
    <main class="container py-5">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
          <div class="card login-card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3">
                  <i class="bi bi-controller"></i>
                </div>
                <h1 class="h3 gamer-title mb-1">LEVEL-UP GAMER</h1>
                <p class="text-secondary mb-0">Ingresa a tu cuenta gamer</p>
              </div>

              <form id="formLogin">
                <div class="mb-3">
                  <label for="usuario" class="form-label"
                    >Correo electrónico</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-envelope"></i
                    ></span>
                    <input
                      type="email"
                      class="form-control"
                      id="usuario"
                      placeholder="admin@admin.cl"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="bi bi-lock"></i
                    ></span>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="••••••"
                      required
                    />
                  </div>
                </div>

                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-levelup btn-lg">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                  </button>
                </div>

                <p class="small text-secondary text-center mt-4 mb-0">
                  Demo académica
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
